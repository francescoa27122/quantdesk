name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing here needs to write to the repository; a compromised
# action or dependency therefore cannot push, tag, or open a release.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA, not a tag. A tag is mutable: whoever
      # controls the action's repo can repoint v4 at new code and it runs here
      # with this job's token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from docker/Dockerfile, not a literal here.
      #
      # It used to be a hardcoded '3.12' while the Dockerfile was its own source
      # of truth, so the two could drift silently — and immediately did. The
      # first Dependabot PR bumped the image to python:3.14-slim and CI went
      # green, because the `test` job had run the 682 tests on 3.12 while only
      # the `build` job saw 3.14. A passing tick meant "the image builds", not
      # "the code works on the new interpreter" — on the container that places
      # orders. Deriving it means a base-image bump is actually tested.
      - name: Resolve the Python version from the Dockerfile
        id: pyver
        run: |
          v="$(grep -oP 'FROM python:\K[0-9]+\.[0-9]+' docker/Dockerfile | head -1)"
          # An empty value would be handed to setup-python, which then picks
          # something of its own choosing — reintroducing the drift silently.
          if [ -z "$v" ]; then
            echo "::error::could not read a Python version from docker/Dockerfile."
            echo "::error::Expected a line like 'FROM python:3.12-slim AS base'."
            exit 1
          fi
          echo "resolved Python $v from docker/Dockerfile"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.pyver.outputs.v }}
          cache: pip

      # Belt and braces: prove the interpreter actually running the suite is the
      # one the image ships. A mismatch here means the resolution above silently
      # did not take effect.
      - name: Confirm the interpreter matches the image
        run: |
          have="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          want="${{ steps.pyver.outputs.v }}"
          echo "running on $have, image ships $want"
          [ "$have" = "$want" ] || {
            echo "::error::tests would run on $have but the image ships $want"
            exit 1
          }

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy ct

      # The suite is offline by design: no database, no exchange, no network.
      # If this step ever needs a service container, that is a smell worth
      # investigating before adding one.
      - name: Tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `target: base` is deliberate and load-bearing. Without it Docker builds
      # the LAST stage (`ml`), which ships LightGBM, pandas, scikit-learn,
      # scipy, hmmlearn and arch into every trading container — 745 MB measured,
      # and the exact opposite of the stated design. Build it here so a
      # regression shows up in CI rather than on the NAS.
      - name: Build the trading image
        run: docker build -f docker/Dockerfile --target base -t quantdesk:base .

      - name: Verify the trading image has no ML dependencies
        run: |
          if docker run --rm quantdesk:base python -c "import lightgbm" 2>/dev/null; then
            echo "::error::qd-engine image contains LightGBM — the build target regressed"
            exit 1
          fi
          echo "ok: no ML dependencies in the base image"
