# Alembic configuration.
#
# ARCHITECTURE.md §2 lists Alembic as the migration tool, and db/schema.sql has
# said "After first boot, all changes go through Alembic. Never edit a live DB
# by hand." since it was written. Neither this file nor a versions directory
# existed, so the only way to change a deployed schema was the thing the comment
# forbids.
#
# Deliberately NOT under db/. That directory is bind-mounted into the Postgres
# container as /docker-entrypoint-initdb.d, which executes every .sql it finds
# on first boot — putting migrations there would hand them to the entrypoint.

[alembic]
script_location = migrations
prepend_sys_path = .
# Explicit, or alembic 1.19 warns and falls back to splitting on spaces,
# commas AND colons — which mangles any Windows path with a drive letter.
path_separator = os

# No sqlalchemy.url here on purpose. The DSN is a deployment concern and lives
# in QD_DB_DSN (or QD_DB_DSN_FILE); migrations/env.py reads it through
# ct.config.Settings so there is exactly one source of truth, and so a database
# password never sits in a file that gets committed.

# Timestamped revision filenames sort chronologically in a directory listing,
# which is how you actually read a migration history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix %(here)s/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
