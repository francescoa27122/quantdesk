[project]
name = "quantdesk"
version = "0.1.0"
description = "Self-hosted algorithmic crypto trading platform for the UGreen DXP2800"
requires-python = ">=3.12"

# Kept deliberately small. Every dependency is a thing that can break the
# trading engine at 3 a.m., and the N100 has no room for a fat image.
# Notably absent: scipy (one inverse-normal call, hand-rolled in metrics.py),
# TA-Lib (needs a C toolchain for ten-line functions), pandas in the hot path.
dependencies = [
  "numpy>=2.0",
  "ccxt>=4.4",                # unified REST + websockets (Pro merged in v4)
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "httpx>=0.27",
  "apscheduler>=3.10",
  "alembic>=1.14",
  "sqlalchemy>=2.0",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
]

[project.optional-dependencies]
# Only installed in qd-worker. Keeping LightGBM out of qd-engine keeps the
# trading container small and means an ML dependency cannot break execution.
ml = [
  "pandas>=2.2",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "hmmlearn>=0.3",
  "arch>=7.0",              # GARCH
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML>=6.0",   # stubs, so `mypy ct` can see through yaml.safe_load
]

[project.scripts]
qd = "ct.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ct*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["asyncio"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 95
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Lint is only useful if a clean run means something. These are deliberate:
ignore = [
  "RUF002",  # "ambiguous" × and — in docstrings. The prose uses them on purpose.
  "RUF003",  # same, in comments.
  "RUF001",  # same again, in strings: "12 × 4h bars" is printed to a human.
  "RUF012",  # ClassVar on Strategy.DEFAULTS — already annotated where it matters.
  "UP017",   # datetime.UTC vs timezone.utc; both fine, not worth the churn.
  "E741",    # `l` for the low series in OHLC code is the domain idiom.
  "B905",    # bare zip(); the length invariant is asserted by tests, not types.

  # UP042 — `class Side(str, Enum)` -> `StrEnum`. Refused, and this one is not
  # about taste. The two are NOT equivalent: StrEnum changes what `str()`,
  # f-strings and `%s` produce. Measured:
  #     (str, Enum)  str(Side.BUY) -> "Side.BUY"
  #     StrEnum      str(Side.BUY) -> "buy"
  # (`json.dumps` and `== "buy"` are identical in both, which is exactly what
  # makes this dangerous — the obvious checks pass.)
  # The 13 affected enums include Side, OrderStatus, ExitReason and Severity:
  # values that are written to the database, embedded in event payloads and
  # matched in logs. A silent change to their rendered form is a change to the
  # audit trail of a trading system, in exchange for nothing but modernity.
  "UP042",

  # SIM102 — merging nested `if`s. Refused as a house style, applied
  # consistently in the risk engine, the protective-exit path and the data
  # integrity monitor. The outer test asks "does this check apply?" and the
  # inner asks "did it fail?"; they are different questions and reviewers of a
  # money path benefit from seeing them separately. Merging the five sites
  # would produce three-line compound conditions in precisely the code you most
  # want to read at a glance, and would strand the explanatory comment that
  # currently sits between the two tests in ct/risk/engine.py.
  "SIM102",

  # RUF022 — sorting `__all__`. ct/events/__init__.py groups its exports by
  # source module with comments (# bus, # log, # types, # factories, # replay),
  # which tells a reader where a name comes from. Alphabetical order would
  # destroy that and tell them nothing.
  "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into privates deliberately (`_execute`, `_check_protective_exits`)
# to pin the exact contract a defect violated.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.12"
strict = true
# The risk engine and the models are the two modules where a type error costs
# money; they are held to strict typing with no escape hatches.
#
# `strict = true` is the DEFAULT for the whole package, so anything new is
# type-checked properly from its first line. The block near the bottom of this
# file lists the modules that predate type checking and are exempted for now.
#
# That list is a RATCHET, not a settled state. It only ever shrinks: annotate a
# module, delete its line, and CI holds it strict from then on. Do not add to it
# — a new module that needs an exemption is a new module that needs annotating.
#
# Why a list rather than narrowing what CI runs: `mypy ct` still checks every
# file, so a type error in a NEW module fails the build. Scoping the command
# instead would have left new code unchecked and made the gap invisible.
[[tool.mypy.overrides]]
# Third parties that ship no type information. Listing them here is not a
# waiver on OUR types — it stops mypy reporting "module is installed but
# missing a py.typed marker" once per import site, which is noise that
# hides real findings.
module = ["ccxt.*", "hmmlearn.*", "lightgbm.*", "arch.*", "apscheduler.*", "asyncpg.*"]
ignore_missing_imports = true

# ── the ratchet: FULLY PAID OFF, 2026-08-04 ──────────────────────────────
# There is deliberately no `ignore_errors` block below this comment, and adding
# one back is a regression rather than a workaround. `strict = true` above now
# applies to every module in `ct` with no exemptions at all.
#
# It began as 31 modules and 159 findings — everything written before mypy was
# first run here — and went to zero in two passes. Kept as a record of what the
# work actually was, because "annotate it" undersells it: five findings were
# genuine defects hiding behind an `Any`, not missing paperwork.
#
# The genuine ones:
#   * `strategy_class()` returned a bare `type`, so every `.name` on its result
#     was unchecked. It returns `type[Strategy]` now.
#   * `ImportStats.summary()` dereferenced two fields having narrowed only one.
#   * `EventBus.subscribe` built its subscriber name from a 3-argument
#     `getattr`, which is `Any`. That name is a dict key and reached
#     `SubscriberStats`, `_Subscription` and the stats map untyped — four
#     findings from one expression.
#   * `qd backtest` bound its portfolio result to the same local as the
#     single-symbol result, so six PortfolioResult-only attributes read as
#     missing. Disjoint branches, one name.
#   * `FeatureSet._memo` and `_cut` returned `Any`, erasing the type of all 36
#     feature accessors between them. Both are generic now — that pair alone
#     was 36 of the last 37 findings.
#
# The techniques, in rough order of how often they applied:
#   * asyncpg ships no py.typed. A third-party stub problem, not our types —
#     it belongs in `ignore_missing_imports` above, and moving it there cleared
#     four modules outright.
#   * Generic helpers instead of `Any` passthroughs (`_memo[T]`, `_cut[T]`).
#     One signature can erase a whole module's types.
#   * `cast(...)` where an untyped library returns Any and the schema or the
#     library's documented contract says what it really is.
#   * `int()`/`float()`/`bool()` coercion where a value came from
#     `params: dict[str, Any]` or numpy. Coercion, not cast: a strategy warmup
#     is a bar count, and a float there fails far from its cause.
#   * `X | None` on attributes wired after `__init__`, plus one `assert` where
#     the wiring guarantees it. On risk-reducing paths (flatten) that assert is
#     deliberate — a missing executor must raise, never be silently skipped.
